services:
  - type: web
    name: roshan-mustaqbil-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    # The start-up script (docker/entrypoint.sh) runs the migrations, creates
    # the administrator and loads the demo data.
    envVars:
      - key: DEBUG
        value: "False"
      - key: HORILLA_ENV
        value: production
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: RENDER_ASYNC_RELEASE_TASKS
        value: "1"
      # Demo data. Going live: set RM_SEED_DEMO_DATA to "0" and
      # RM_REMOVE_DEMO_DATA to "1" for one deploy, then back to "0".
      - key: RM_SEED_DEMO_DATA
        value: "1"
      - key: RM_REMOVE_DEMO_DATA
        value: "0"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: roshan-mustaqbil-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: roshan-mustaqbil-demo
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECRET_KEY
        generateValue: true
      - key: DB_INIT_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_USERNAME
        value: admin
      # The administrator's password (the only sign-in). Not stored in the
      # repository: Render asks for it when the Blueprint is created, and the
      # deploy stops with an error if it's left blank.
      - key: DEMO_ADMIN_PASSWORD
        sync: false
databases:
  - name: roshan-mustaqbil-db
    plan: free
    region: singapore
