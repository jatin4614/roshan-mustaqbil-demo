services:
  - type: web
    name: roshan-mustaqbil-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    initialDeployHook: >-
      python manage.py bootstrap_roshan_mustaqbil_demo &&
      python manage.py seed_youth_centre_demo
    envVars:
      - key: DEBUG
        value: "False"
      - key: HORILLA_ENV
        value: production
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: RENDER_ASYNC_RELEASE_TASKS
        value: "1"
      - key: RM_SEED_DEMO_DATA
        value: "1"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: roshan-mustaqbil-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          name: roshan-mustaqbil-demo
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SECRET_KEY
        generateValue: true
      - key: DB_INIT_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_USERNAME
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        value: "Admin123"
databases:
  - name: roshan-mustaqbil-db
    plan: free
    region: singapore
