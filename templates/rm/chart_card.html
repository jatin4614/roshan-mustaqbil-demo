<section class="rm-card rounded-2xl bg-white p-6"><div class="flex items-start justify-between gap-4"><div><p class="text-xs font-bold uppercase tracking-wider text-teal-700">Distribution</p><h2 class="mt-1 text-lg font-bold text-slate-800">{{ title }}</h2></div><span class="grid h-9 w-9 place-items-center rounded-full bg-teal-50 text-sm font-bold text-teal-700">{{ data|length }}</span></div><div class="mt-6 space-y-4">{% for item in data %}<div class="rm-series"><div class="mb-1.5 flex justify-between gap-3 text-sm"><span class="truncate font-medium text-slate-700">{{ item.label }}</span><b class="text-slate-800">{{ item.count }}</b></div><div class="h-2.5 overflow-hidden rounded-full bg-slate-100"><div class="rm-series-fill h-full rounded-full" style="width:{{ item.percent }}%"></div></div></div>{% empty %}<div class="rounded-xl bg-slate-50 p-5 text-sm text-slate-500">No data recorded yet.</div>{% endfor %}</div></section>
<style>.rm-series:nth-child(5n+1) .rm-series-fill{background:#0f766e}.rm-series:nth-child(5n+2) .rm-series-fill{background:#335c8a}.rm-series:nth-child(5n+3) .rm-series-fill{background:#d89c31}.rm-series:nth-child(5n+4) .rm-series-fill{background:#7067a8}.rm-series:nth-child(5n) .rm-series-fill{background:#c65b4b}</style>
