<style>
  .rm-shell{--rm-ink:#172033;--rm-muted:#667085;--rm-paper:#fffdf9;--rm-canvas:#f4f7f8;--rm-teal:#0f766e;--rm-teal-soft:#d9f0ec;--rm-blue:#335c8a;--rm-gold:#d89c31;--rm-coral:#c65b4b;--rm-violet:#7067a8;--rm-line:#e7ebee} .oh-wrapper{color:var(--rm-ink)} body{background:var(--rm-canvas)}
  .rm-hero{background:linear-gradient(118deg,#172033 0%,#1f3b4d 58%,#0f766e 150%);position:relative;overflow:hidden}.rm-hero:after{content:"";position:absolute;width:17rem;height:17rem;right:-5rem;top:-10rem;border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 0 0 2.6rem rgba(255,255,255,.045),0 0 0 5.2rem rgba(255,255,255,.035)}
  .rm-card{border:1px solid var(--rm-line);box-shadow:0 8px 24px rgba(23,32,51,.055)} .rm-kpi{border-top:3px solid var(--rm-teal)} .rm-kpi:nth-child(2n){border-top-color:var(--rm-blue)} .rm-kpi:nth-child(3n){border-top-color:var(--rm-gold)} .rm-kpi:nth-child(5n){border-top-color:var(--rm-violet)}
</style>
<header class="rm-hero rounded-3xl p-7 text-white shadow-card"><div class="relative z-10"><p class="text-sm font-semibold tracking-wide text-teal-100">ROSHAN MUSTAQBIL · RM INSIGHTS</p><h1 class="mt-2 text-3xl font-bold">{{ title }}</h1><p class="mt-2 max-w-2xl text-slate-200">{{ subtitle }}</p></div></header>
