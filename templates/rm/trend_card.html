<section class="rm-card rounded-2xl bg-white p-6"><div class="flex items-start justify-between"><div><p class="text-xs font-bold uppercase tracking-wider text-teal-700">Footfall trend</p><h2 class="mt-1 text-lg font-bold text-slate-800">{{ title }}</h2></div><span class="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold text-teal-700">Last 30 days</span></div><div class="mt-8 flex h-44 items-end gap-1.5" aria-label="{{ title }}">{% for item in data %}<div class="group flex h-full flex-1 items-end" title="{{ item.label }}: {{ item.count }} visits"><div class="w-full rounded-t-md bg-teal-600 transition group-hover:bg-amber-500" style="height:{% if item.count %}{{ item.percent }}%{% else %}3px{% endif %}"></div></div>{% endfor %}</div>{% with final=data|last %}<div class="mt-3 flex justify-between text-xs text-slate-400"><span>{{ data.0.label }}</span><span>{{ final.label }}</span></div>{% endwith %}</section>
